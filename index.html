<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Tree</title>
<style>
  :root {
    --bg: #f7f8fa;
    --grid: #d9dce3;
    --card: #ffffff;
    --border: #e1e4ea;
    --text: #1f2430;
    --muted: #8a92a6;
    --accent: #4262ff;
    --accent-soft: #e8ecff;
    --line: #b8bfd0;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(20,24,40,.06), 0 6px 18px rgba(20,24,40,.08);
    --card-w: 280px;
    --card-h: 112px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: var(--text); background: var(--bg); }
  button { font: inherit; color: inherit; }

  #viewport {
    position: absolute; inset: 0; overflow: hidden; cursor: default;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--grid) 1px, transparent 1.2px);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #viewport.panning, #viewport.space { cursor: grab; }
  #viewport.panning.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #world.anim { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; }

  .card {
    position: absolute; width: var(--card-w); height: var(--card-h);
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; padding: 12px;
    cursor: pointer; transition: box-shadow .15s, border-color .15s; -webkit-tap-highlight-color: transparent;
  }
  .edit input { user-select: text; -webkit-user-select: text; }
  .card:hover { box-shadow: 0 2px 4px rgba(20,24,40,.08), 0 10px 28px rgba(20,24,40,.12); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .card.editing { cursor: default; }
  .photo {
    position: relative; flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, #dfe4ff, #f3e8ff); overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; color: #5a63a8;
    cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .cam {
    position: absolute; inset: 0; background: rgba(20,24,40,.45); color: #fff; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s; font-size: 18px;
  }
  .photo:hover .cam { opacity: 1; }
  .photo-x {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; border: none;
    background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; padding: 0; cursor: pointer; display: none;
  }
  .card.editing .photo-x.has-photo { display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name.empty, .dates.empty { color: var(--muted); font-weight: 400; }
  .dates { font-size: 13px; color: #5b6377; }
  .card.editing .name, .card.editing .dates { display: none; }
  .edit { display: none; flex-direction: column; gap: 4px; }
  .card.editing .edit { display: flex; }
  .edit input[type=text] {
    width: 100%; font: inherit; font-weight: 600; font-size: 15px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  .edit input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .edit .row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); height: 22px; }
  .edit .row label { width: 40px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit input.f-bname { font-weight: 400; font-size: 12px; padding: 1px 6px; flex: 1; width: auto; }
  .card.editing { height: auto; min-height: var(--card-h); z-index: 2; }
  .edit input[type=date] { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px; outline: none; flex: 1; min-width: 0; color: var(--text); }
  .edit .alive { display: flex; align-items: center; gap: 4px; width: auto; cursor: pointer; white-space: nowrap; color: var(--text); }
  .edit .alive input { margin: 0; }

  .plus {
    position: absolute; width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0;
    background: var(--accent); color: #fff; font-size: 18px; line-height: 26px; text-align: center; cursor: pointer;
    box-shadow: 0 2px 6px rgba(66,98,255,.4); opacity: 0; transform: scale(.6); transition: opacity .12s, transform .12s;
    pointer-events: none;
  }
  .card:hover .plus, .card.selected .plus { opacity: 1; transform: scale(1); pointer-events: auto; }
  .card.editing .plus { opacity: 0; pointer-events: none; }
  .plus:hover { background: #2f4de0; transform: scale(1.12) !important; }
  .plus.top { left: 50%; top: -13px; margin-left: -13px; }
  .plus.bottom { left: 50%; bottom: -13px; margin-left: -13px; }
  .plus.left { top: 50%; left: -13px; margin-top: -13px; }
  .plus.right { top: 50%; right: -13px; margin-top: -13px; }
  .plus::after {
    content: attr(data-tip); position: absolute; white-space: nowrap; font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 5px;
    background: #1f2430; color: #fff; opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .plus:hover::after { opacity: 1; }
  .plus.top::after { bottom: 30px; left: 50%; transform: translateX(-50%); }
  .plus.bottom::after { top: 30px; left: 50%; transform: translateX(-50%); }
  .plus.left::after { right: 30px; top: 50%; transform: translateY(-50%); }
  .plus.right::after { left: 30px; top: 50%; transform: translateY(-50%); }
  .plus.spouse { right: -13px; top: -13px; background: #e5488f; box-shadow: 0 2px 6px rgba(229,72,143,.4); font-size: 13px; }
  .plus.spouse:hover { background: #c93579; }
  .plus.spouse::after { left: 30px; top: 50%; transform: translateY(-50%); }

  .marriage {
    position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line);
    color: #5b6377; font-size: 11px; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 4px; line-height: 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .marriage:hover { border-color: #e5488f; box-shadow: 0 2px 8px rgba(229,72,143,.25); }
  .marriage .h { color: #e5488f; font-size: 10px; }
  .marriage.empty { padding: 2px 6px; }

  #mpop { position: absolute; z-index: 25; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,24,40,.2); padding: 12px 14px; width: 250px; display: none; font-size: 13px; }
  #mpop.show { display: block; }
  #mpop h4 { margin: 0 0 8px; font-size: 13px; }
  #mpop .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #mpop label { width: 54px; color: var(--muted); font-size: 12px; }
  #mpop input[type=date] { flex: 1; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none; min-width: 0; }
  #mpop input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #mpop .foot { display: flex; justify-content: space-between; margin-top: 10px; }
  #mpop button { border: none; background: #f0f2f7; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  #mpop button.danger { color: var(--danger); background: transparent; }

  #crop { position: absolute; inset: 0; background: rgba(20,24,40,.45); display: none; align-items: center; justify-content: center; z-index: 40; }
  #crop.show { display: flex; }
  #crop .panel { background: #fff; border-radius: 16px; padding: 18px 20px; width: 340px; max-width: calc(100vw - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  #crop h4 { margin: 0 0 12px; font-size: 15px; }
  #crop .stage { position: relative; width: 300px; height: 300px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #eef0f5; touch-action: none; cursor: grab; }
  #crop .stage:active { cursor: grabbing; }
  #crop canvas { width: 300px; height: 300px; display: block; }
  #crop .mask { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px rgba(255,255,255,.6); pointer-events: none; border: 1px solid rgba(0,0,0,.15); }
  #crop .zoomrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  #crop .zoomrow input { flex: 1; }
  #crop .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  #crop .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #crop button { border: none; background: #f0f2f7; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  #crop button.primary { background: var(--accent); color: #fff; }
  #menu { position: absolute; z-index: 25; background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(20,24,40,.2); padding: 6px; display: none; min-width: 180px; }
  #menu.show { display: block; }
  #menu .t { font-size: 11px; color: var(--muted); padding: 4px 8px; }
  #menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #menu button:hover, #menu button:focus { background: #f0f2f7; outline: none; }

  #empty {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted);
  }
  #empty .big {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 36px; line-height: 60px;
    box-shadow: 0 6px 20px rgba(66,98,255,.35); transition: transform .15s;
  }
  #empty:hover .big { transform: scale(1.08); }
  #empty[hidden] { display: none; }
  #empty p { margin: 0; font-size: 15px; }

  .bar {
    position: absolute; display: flex; align-items: center; gap: 4px; padding: 6px; background: #fff; border-radius: 12px; box-shadow: var(--shadow);
    z-index: 10; user-select: none;
  }
  #topleft { left: 16px; top: 16px; }
  #topright { right: 16px; top: 16px; }
  #bottom { left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12px; color: var(--muted); padding: 8px 14px; gap: 14px; }
  .bar button {
    border: none; background: transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--text);
  }
  .bar button:hover { background: #f0f2f7; }
  .bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  #filename { font-weight: 600; font-size: 13px; padding: 0 8px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filename.dirty::after { content: " •"; color: var(--accent); }
  #lang { font: inherit; font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 4px; background: #fff; color: var(--text); margin: 0 4px; }
  .name .nee { font-weight: 400; color: var(--muted); font-size: 13px; }
  #zoomlvl { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  kbd { display: inline-block; padding: 1px 5px; border-radius: 4px; background: #f0f2f7; border: 1px solid var(--border); font-family: inherit; font-size: 11px; color: var(--text); }

  #toast {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%) translateY(10px); background: #1f2430; color: #fff; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #help { position: absolute; inset: 0; background: rgba(20,24,40,.35); display: none; align-items: center; justify-content: center; z-index: 30; }
  #help.show { display: flex; }
  #help .panel { background: #fff; border-radius: 16px; padding: 24px 28px; width: 560px; max-height: 80vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  #help h2 { margin: 0 0 14px; font-size: 18px; }
  #help h3 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #help .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-size: 13px; }
  #help .grid div { display: flex; justify-content: space-between; gap: 12px; }
  #help .grid span:last-child { white-space: nowrap; }
  input[type=file] { display: none; }

  #actions { left: 50%; bottom: 16px; transform: translateX(-50%); display: none; }
  #actions.show { display: flex; }
  #actions button { padding: 8px 12px; white-space: nowrap; }
  #actions button.danger { color: var(--danger); }
  body.has-selection #bottom { display: none; }

  @media (pointer: coarse) {
    .plus { width: 34px; height: 34px; line-height: 34px; font-size: 22px; opacity: 0; }
    .plus.top { top: -17px; margin-left: -17px; } .plus.bottom { bottom: -17px; margin-left: -17px; }
    .plus.left { left: -17px; margin-top: -17px; } .plus.right { right: -17px; margin-top: -17px; }
    .plus.spouse { right: -17px; top: -17px; }
    .marriage { font-size: 12px; padding: 4px 10px; }
    .card:hover .plus { opacity: 0; pointer-events: none; }
    .card.selected .plus { opacity: 1; pointer-events: auto; transform: scale(1); }
    .card.editing .plus { opacity: 0; pointer-events: none; }
    .photo .cam { display: none; }
    .edit input[type=text], .edit input[type=date] { font-size: 16px; }
    #bottom { display: none; }
  }
  @media (max-width: 640px) {
    #topleft { left: 8px; top: calc(8px + env(safe-area-inset-top)); }
    #topright { left: 8px; right: auto; top: calc(56px + env(safe-area-inset-top)); }
    #filename { max-width: 110px; }
    .bar button { padding: 6px 8px; }
    #topright [data-act=fit], #topright [data-act=help], #topright #zoomlvl, #topright .sep { display: none; }
    #topright #lang { display: inline-block; }
    #topleft [data-act=saveas], #topleft [data-act=pdf], #topleft .sep:has(+ [data-act=pdf]) { display: none; }
    #actions { bottom: calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
    #help .panel { width: calc(100vw - 24px); padding: 18px; }
    #help .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="world">
    <svg id="edges"></svg>
    <div id="cards"></div>
  </div>
  <div id="empty" hidden>
    <div class="big">+</div>
    <p data-i18n="empty"></p>
  </div>
</div>

<div class="bar" id="topleft">
  <span id="filename">Untitled tree</span>
  <span class="sep"></span>
  <button data-act="new" data-i18n="new" data-i18n-title="new_t"></button>
  <button data-act="open" data-i18n="open" data-i18n-title="open_t"></button>
  <button data-act="save" data-i18n="save" data-i18n-title="save_t"></button>
  <button data-act="saveas" data-i18n="saveas" data-i18n-title="saveas_t"></button>
  <span class="sep"></span>
  <button data-act="pdf" data-i18n="export_pdf" data-i18n-title="export_t"></button>
</div>
<div class="bar" id="topright">
  <button data-act="undo" title="Undo (⌘Z)">↶</button>
  <button data-act="redo" title="Redo (⇧⌘Z)">↷</button>
  <span class="sep"></span>
  <button data-act="zoomout" title="Zoom out (−)">−</button>
  <span id="zoomlvl">100%</span>
  <button data-act="zoomin" title="Zoom in (+)">+</button>
  <button data-act="fit" data-i18n="fit" data-i18n-title="fit_t"></button>
  <span class="sep"></span>
  <select id="lang" title="Language"><option value="en">EN</option><option value="ru">RU</option><option value="de">DE</option></select>
  <button data-act="help" data-i18n-title="help_t">?</button>
</div>
<div class="bar" id="bottom">
  <span><kbd>↑↓←→</kbd> <span data-i18n="hint_nav"></span></span>
  <span><kbd>Enter</kbd> <span data-i18n="hint_edit"></span></span>
  <span><kbd>P</kbd> <kbd>C</kbd> <kbd>S</kbd> <kbd>M</kbd> <span data-i18n="hint_add"></span></span>
  <span><kbd>⌫</kbd> <span data-i18n="hint_del"></span></span>
  <span><kbd>?</kbd> <span data-i18n="hint_help"></span></span>
</div>
<div class="bar" id="actions">
  <button data-sel="edit" data-i18n="edit"></button>
  <button data-sel="photo" data-i18n="photo"></button>
  <span class="sep"></span>
  <button data-sel="parent" data-i18n="add_parent"></button>
  <button data-sel="sibling-right" data-i18n="add_sibling"></button>
  <button data-sel="child" data-i18n="add_child"></button>
  <button data-sel="spouse" data-i18n="add_spouse"></button>
  <span class="sep"></span>
  <button data-sel="delete" class="danger" data-i18n="delete"></button>
</div>
<div id="toast"></div>
<div id="mpop">
  <h4 id="mpop-title">Marriage</h4>
  <div class="row"><label data-i18n="married"></label><input type="date" id="m-from"></div>
  <div class="row"><label data-i18n="until"></label><input type="date" id="m-to"></div>
  <div class="foot"><button class="danger" id="m-unlink" data-i18n="unlink"></button><button id="m-close" data-i18n="done"></button></div>
</div>
<div id="menu"></div>
<div id="crop">
  <div class="panel">
    <h4 data-i18n="crop_title"></h4>
    <div class="stage"><canvas id="crop-canvas" width="600" height="600"></canvas><div class="mask"></div></div>
    <div class="zoomrow"><span data-i18n="zoom"></span><input type="range" id="crop-zoom" min="0" max="1000" value="0"></div>
    <p class="hint" data-i18n="crop_hint"></p>
    <div class="foot"><button id="crop-cancel" data-i18n="cancel"></button><button id="crop-ok" class="primary" data-i18n="apply"></button></div>
  </div>
</div>

<div id="help"><div class="panel"></div></div>

<input type="file" id="photoInput" accept="image/*">
<input type="file" id="fileInput" accept=".ftree,.json">

  const CARD_W = 280, CARD_H = 112, H_GAP = 36, V_GAP = 96, COUPLE_GAP = 76, TREE_GAP = 100;

  const people = () => Object.values(state.people);

  function parentFamilies(pid) { return Object.values(state.families).filter(f => f.parents.includes(pid)); }
  function parentsOf(pid) { const f = childFamily(pid); return f ? f.parents : []; }
  function childrenOf(pid) { return parentFamilies(pid).flatMap(f => f.children); }

  function newPerson() {
    const p = { id: uid('p'), name: '', birthName: '', birth: '', death: '', alive: true, photo: null, photoSrc: null, crop: null };
    state.people[p.id] = p;

  }
  function newFamily(parents, children) {
    const f = { id: uid('f'), parents, children, married: '', ended: '' };

  }

  function addParent(pid) {
    const f = childFamily(pid);

    if (f) f.parents.push(p.id); else newFamily([p.id], [pid]);

  }

    return p;
  }

    const p = newPerson();

    return p;
  }

    const p = newPerson();

    const i = f.children.indexOf(pid) + (side === 'left' ? 0 : 1);
    f.children.splice(i, 0, p.id);

  }

      f.parents = f.parents.filter(x => x !== pid);
      f.children = f.children.filter(x => x !== pid);
      const meaningless = (f.parents.length === 0 && f.children.length <= 1) || (f.children.length === 0 && f.parents.length <= 1);
      if (f.parents.length === 0 && f.children.length === 0) delete state.families[f.id];
      if (meaningless) delete state.families[f.id];

  function layout() {
    positions = new Map();
    marriages = [];
    const claimed = new Set();
    const roots = people().filter(p => !childFamily(p.id));

    function buildNode(pid) {
      const unit = [pid]; claimed.add(pid);
      for (let i = 0; i < unit.length; i++) {
        for (const f of parentFamilies(unit[i])) for (const sp of f.parents) {
          if (!claimed.has(sp)) { claimed.add(sp); unit.push(sp); }
        }
      }
      const fams = [...new Set(unit.flatMap(parentFamilies))];
      const groups = fams.map(f => ({ f, children: f.children.filter(id => !claimed.has(id)).map(buildNode).filter(Boolean) }))
        .filter(g => g.children.length);
      return { unit, groups };
    }

    const forest = [];
    const cluster = (pid) => { const seen = new Set([pid]); for (const a of seen) for (const sp of spousesOf(a)) seen.add(sp); return [...seen]; };
    const topRoots = roots.filter(p => cluster(p.id).every(id => !childFamily(id)));
    for (const list of [topRoots, roots, people()]) {
      for (const p of list) if (!claimed.has(p.id)) forest.push(buildNode(p.id));
    }

    function measure(n) {
      n.uw = n.unit.length * CARD_W + Math.max(0, n.unit.length - 1) * COUPLE_GAP;
      n.cw = 0;
      for (const g of n.groups) {
        g.w = 0;
        g.children.forEach((c, i) => { g.w += measure(c) + (i ? H_GAP : 0); });
        n.cw += g.w + (n.cw ? H_GAP : 0);
      }
      n.w = Math.max(n.uw, n.cw);
      return n.w;
    }
    function place(n, x, depth) {
      const y = depth * (CARD_H + V_GAP);
      let ux = x + (n.w - n.uw) / 2;
      for (const id of n.unit) { positions.set(id, { x: ux, y }); ux += CARD_W + COUPLE_GAP; }
      const originX = (g) => g.f.parents.filter(id => positions.has(id)).reduce((a, id, _, arr) => a + (positions.get(id).x + CARD_W / 2) / arr.length, 0);
      const ordered = [...n.groups].sort((a, b) => originX(a) - originX(b));
      let cx = x + (n.w - n.cw) / 2;
      for (const g of ordered) {
        let gx = cx;
        for (const c of g.children) { place(c, gx, depth + 1); gx += c.w + H_GAP; }
        cx += g.w + H_GAP;
      }
    }
    let total = 0;
    forest.forEach((n, i) => { total += measure(n) + (i ? TREE_GAP : 0); });
    let x = -total / 2;
    for (const n of forest) { place(n, x, 0); x += n.w + TREE_GAP; }
  }

  function renderEdges() {
    const d = [];
    marriages = [];
    const mid = (id) => { const p = positions.get(id); return { id, x: p.x, cx: p.x + CARD_W / 2, cy: p.y + CARD_H / 2, top: p.y, bottom: p.y + CARD_H }; };

  }

  function createRelative(id, kind, anchor, familyId) {
    if (kind === 'child' && !familyId) {
      const fams = parentFamilies(id);
      if (fams.length > 1) {
        const items = fams.map(f => ({
          label: t('with') + ' ' + (f.parents.filter(x => x !== id).map(x => state.people[x]?.name || t('unnamed')).join(', ') || t('no_partner')),
          run: () => createRelative(id, 'child', null, f.id),
        }));
        return openMenu(anchor || cardEl(id), t('add_child_menu'), items);
      }
    }
    const p = mutate(() => {
      if (kind === 'parent') return addParent(id);
      if (kind === 'child') return addChild(id, familyId);
      if (kind === 'spouse') return addSpouse(id);
      return addSibling(id, kind === 'sibling-left' ? 'left' : 'right');
    });
    if (!p) return toast(t('two_parents'));
    startEditing(p.id, '.f-name', true);
    ensureVisible(p.id);
  }
  function createFirst() {
    const p = mutate(() => newPerson());
    resetView();
    startEditing(p.id, '.f-name', true);
  }
  emptyEl.addEventListener('click', createFirst);

  function removeSelected() {
    if (!selectedId) return;
    const id = selectedId;
    const next = nearestRelative(id);
    stopEditing();
    mutate(() => deletePerson(id));
    select(next);
    toast(t('deleted'));
  }

  function navigate(dir) {
    if (!selectedId) { const first = people()[0]; if (first) select(first.id); return; }
    const id = selectedId;
    let target = null;
    if (dir === 'up') target = parentsOf(id)[0];
    else if (dir === 'down') target = childrenOf(id)[0];
    else {
      const sibs = siblingsOf(id); const i = sibs.indexOf(id);
      target = sibs[i + (dir === 'left' ? -1 : 1)];
      if (!target) target = spousesOf(id).find(sp => (positions.get(sp).x - positions.get(id).x) * (dir === 'left' ? -1 : 1) > 0);
    }
    if (!target) target = spatialNeighbour(id, dir);
    if (target) select(target);
  }
  function spatialNeighbour(id, dir) {
    const a = positions.get(id); let best = null, bestD = Infinity;
    for (const [oid, b] of positions) {
      if (oid === id) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      let ok;
      if (dir === 'up') ok = dy < 0 && Math.abs(dx) <= Math.abs(dy) * 2 + CARD_W;
      else if (dir === 'down') ok = dy > 0 && Math.abs(dx) <= Math.abs(dy) * 2 + CARD_W;
      else if (dir === 'left') ok = dx < 0 && Math.abs(dy) <= Math.abs(dx);
      else ok = dx > 0 && Math.abs(dy) <= Math.abs(dx);
      if (!ok) continue;
      const d = (dir === 'up' || dir === 'down') ? Math.abs(dy) * 2 + Math.abs(dx) : Math.abs(dx) * 2 + Math.abs(dy);
      if (d < bestD) { bestD = d; best = oid; }
    }
    return best;
  }

  document.addEventListener('keydown', (e) => {
    const inField = e.target.matches('input, textarea, [contenteditable]');
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(e.shiftKey); return; }
    if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); open(); return; }
    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); newTree(); return; }
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (inField) return;
    if (e.key === 'Escape') {
      if ($('#help').classList.contains('show')) return $('#help').classList.remove('show');
      if (mpopFamily) return closeMarriage();
      return select(null);
    }
    if (e.key === ' ') { e.preventDefault(); spaceDown = true; viewport.classList.add('panning'); return; }
    if (e.key === '?') return $('#help').classList.toggle('show');
    if (e.key === 'f' || e.key === 'F') return fitView();
    if (e.key === '0') return resetView();
    if (e.key === '+' || e.key === '=') return zoomAt(1.2, viewport.clientWidth / 2, viewport.clientHeight / 2, true);
    if (e.key === '-' || e.key === '_') return zoomAt(1 / 1.2, viewport.clientWidth / 2, viewport.clientHeight / 2, true);

    if (!people().length && (e.key === 'Enter' || e.key.toLowerCase() === 'n')) { e.preventDefault(); return createFirst(); }
    const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    if (dirs[e.key]) {
      e.preventDefault();
      if (e.shiftKey && selectedId) {
        const kind = { up: 'parent', down: 'child', left: 'sibling-left', right: 'sibling-right' }[dirs[e.key]];
        return createRelative(selectedId, kind);
      }
      return navigate(dirs[e.key]);
    }
    if (!selectedId) { if (e.key === 'Tab') { e.preventDefault(); navigate('right'); } return; }
    if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); return startEditing(selectedId); }
    if (e.key === 'Tab') { e.preventDefault(); return navigate(e.shiftKey ? 'left' : 'right'); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); return removeSelected(); }
    const k = e.key.toLowerCase();
    if (k === 'p' || k === 'c' || k === 's' || k === 'm') {
      e.preventDefault();
      createRelative(selectedId, { p: 'parent', c: 'child', s: 'sibling-right', m: 'spouse' }[k]);
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === ' ') { spaceDown = false; if (!pan) viewport.classList.remove('panning'); }
  });

  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const c = viewport.clientWidth / 2, m = viewport.clientHeight / 2;
    ({
      new: newTree, open, save: () => save(false), saveas: () => save(true), undo, redo, pdf: exportPdf,
      zoomin: () => zoomAt(1.2, c, m, true), zoomout: () => zoomAt(1 / 1.2, c, m, true), fit: fitView,
      help: () => $('#help').classList.toggle('show'),
    })[b.dataset.act]();
  }));
  $('#actions').addEventListener('click', (e) => {
    const b = e.target.closest('[data-sel]'); if (!b || !selectedId) return;
    const a = b.dataset.sel;
    if (a === 'edit') startEditing(selectedId);
    else if (a === 'photo') photoAction(selectedId, b);
    else if (a === 'delete') removeSelected();
    else createRelative(selectedId, a, b);
  });
  $('#help').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });

  const hasFS = 'showSaveFilePicker' in window;
  const EXT = '.ftree';
  const pickerOpts = { suggestedName: 'family-tree' + EXT, types: [{ description: 'Family tree', accept: { 'application/octet-stream': [EXT] } }] };
  const openTypes = [{ description: 'Family tree', accept: { 'application/octet-stream': [EXT], 'application/json': ['.json'] } }];
  const MAGIC = [0x46, 0x54, 0x52, 0x45, 0x45, 0x01];

  function dataUrlToBytes(url) {
    const i = url.indexOf(','); const mime = url.slice(5, url.indexOf(';')); const bin = atob(url.slice(i + 1));
    const out = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
    return { mime, bytes: out };
  }
  function bytesToDataUrl(bytes, mime) {
    let bin = ''; for (let k = 0; k < bytes.length; k += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000));
    return `data:${mime};base64,` + btoa(bin);
  }
  function serialize() {
    const blobs = [];
    const ref = (url) => { if (!url) return null; const { mime, bytes } = dataUrlToBytes(url); blobs.push({ mime, bytes }); return blobs.length - 1; };
    const people = {};
    for (const p of Object.values(state.people)) {
      const { photo, photoSrc, ...rest } = p;
      people[p.id] = { ...rest, thumbRef: ref(photo), photoRef: ref(photoSrc) };
    }
    const meta = new TextEncoder().encode(JSON.stringify({ version: 1, people, families: state.families, blobs: blobs.map(b => b.mime) }));
    const head = new Uint8Array(MAGIC.length + 4); head.set(MAGIC);
    new DataView(head.buffer).setUint32(MAGIC.length, meta.length, true);
    const parts = [head, meta];
    for (const b of blobs) { const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, b.bytes.length, true); parts.push(len, b.bytes); }
    return new Blob(parts, { type: 'application/octet-stream' });
  }
  function deserialize(buf) {
    const u8 = new Uint8Array(buf);
    if (!MAGIC.slice(0, 5).every((b, i) => u8[i] === b)) {
      const text = new TextDecoder().decode(u8).trim();
      if (!text.startsWith('{')) throw new Error(t('not_tree'));
      return JSON.parse(text);
    }
    const dv = new DataView(buf);
    let off = MAGIC.length;
    const metaLen = dv.getUint32(off, true); off += 4;
    const meta = JSON.parse(new TextDecoder().decode(u8.subarray(off, off + metaLen))); off += metaLen;
    const blobs = [];
    for (const mime of meta.blobs || []) {
      const len = dv.getUint32(off, true); off += 4;
      blobs.push(bytesToDataUrl(u8.subarray(off, off + len), mime)); off += len;
    }
    const people = {};
    for (const p of Object.values(meta.people || {})) {
      const { thumbRef, photoRef, ...rest } = p;
      people[p.id] = { ...rest, photo: thumbRef == null ? null : blobs[thumbRef], photoSrc: photoRef == null ? null : blobs[photoRef] };
    }
    return { version: 1, people, families: meta.families || {} };
  }

  async function save(as) {
    stopEditing();
    const blob = serialize();
    try {
      if (hasFS) {
        if (!fileHandle || as) {
          fileHandle = await window.showSaveFilePicker({ ...pickerOpts, suggestedName: fileHandle?.name || pickerOpts.suggestedName });
          fileName = fileHandle.name;
        }
        const w = await fileHandle.createWritable(); await w.write(blob); await w.close();
      } else {
        if (isUntitled() || as) {
          const n = prompt(t('file_name'), isUntitled() ? 'family-tree' + EXT : fileName.replace(/\.json$/, EXT));
          if (!n) return; fileName = n.endsWith(EXT) ? n : n + EXT;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      dirty = false; render(); toast(t('saved') + ' ' + fileName);
    } catch (err) { if (err.name !== 'AbortError') toast(t('save_failed') + ': ' + err.message); }
  }

  async function open() {
    if (dirty && !confirm(t('discard'))) return;
    try {
      if (hasFS) {
        const [h] = await window.showOpenFilePicker({ types: openTypes, multiple: false });
        const buf = await (await h.getFile()).arrayBuffer();
        loadData(buf, h.name); fileHandle = h.name.endsWith(EXT) ? h : null;
      } else fileInput.click();
    } catch (err) { if (err.name !== 'AbortError') toast(t('open_failed') + ': ' + err.message); }
  }
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0]; fileInput.value = ''; if (!f) return;
    try { loadData(await f.arrayBuffer(), f.name); } catch (err) { toast(t('open_failed') + ': ' + err.message); }
  });
  function loadData(buf, name) {
    const data = deserialize(buf);
    if (!data || typeof data.people !== 'object' || typeof data.families !== 'object') throw new Error(t('not_tree'));
    state = { version: 1, people: data.people, families: data.families };
    for (const p of Object.values(state.people)) { p.alive = p.alive ?? !p.death; p.name ??= ''; p.birthName ??= ''; p.birth ??= ''; p.death ??= ''; p.photo ??= null; p.photoSrc ??= null; p.crop ??= null; }
    for (const f of Object.values(state.families)) { f.married ??= ''; f.ended ??= ''; f.parents ??= []; f.children ??= []; }
    fileName = name.replace(/\.json$/, EXT); fileHandle = null; dirty = name.endsWith('.json'); undoStack = []; redoStack = []; selectedId = null; editingId = null;
    render(); fitView(); scheduleDraft(); toast(t('opened') + ' ' + name);
  }
  function newTree() {
    if (dirty && !confirm(t('discard'))) return;
    state = emptyState(); fileHandle = null; fileName = t('untitled'); dirty = false;
    undoStack = []; redoStack = []; selectedId = null; editingId = null;
    render(); resetView(); scheduleDraft();
  }

  function isUntitled() { return Object.values(I18N).some(d => d.untitled === fileName); }
  function scheduleDraft() {
    clearTimeout(scheduleDraft.t);
    scheduleDraft.t = setTimeout(() => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ state, fileName, dirty })); } catch (_) {}
    }, 400);
  }
  function restoreDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (d && d.state && Object.keys(d.state.people).length) { state = d.state; fileName = d.fileName || fileName; dirty = !!d.dirty; return true; }
    } catch (_) {}
    return false;
  }
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  fileName = t('untitled');
  const restored = restoreDraft();
  applyI18n();
  render();
  document.getElementById('lang').addEventListener('change', (e) => setLang(e.target.value));
  if (restored) { fitView(); toast(t('restored')); } else resetView();
})();
</script>
</body>
</html>
