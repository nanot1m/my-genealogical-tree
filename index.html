<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Tree">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Family Tree</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb;
    --grid: #d6dae4;
    --card: #ffffff;
    --panel: #ffffff;
    --panel-2: #f1f3f8;
    --border: #e3e6ee;
    --border-strong: #cfd4e0;
    --text: #1b2030;
    --muted: #7c859b;
    --accent: #4262ff;
    --accent-2: #2f4de0;
    --accent-soft: #e9edff;
    --line: #b7bed0;
    --danger: #e5484d;
    --love: #e5488f;
    --ok: #2aa871;
    --shadow-sm: 0 1px 2px rgba(20,24,40,.06), 0 2px 8px rgba(20,24,40,.06);
    --shadow: 0 1px 2px rgba(20,24,40,.05), 0 8px 24px rgba(20,24,40,.08);
    --shadow-lg: 0 20px 60px rgba(20,24,40,.18);
    --radius: 14px;
    --card-w: 280px;
    --card-h: 112px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1218;
      --grid: #1f2533;
      --card: #171b25;
      --panel: #171b25;
      --panel-2: #1f2432;
      --border: #262c3b;
      --border-strong: #343b4d;
      --text: #e7eaf2;
      --muted: #8e97ad;
      --accent: #6b86ff;
      --accent-2: #8aa0ff;
      --accent-soft: #1f2a55;
      --line: #3b4357;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 2px 6px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
      --shadow-lg: 0 24px 70px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; font-family: var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent-soft); }
  button { font: inherit; color: inherit; }

  #viewport {
    position: absolute; inset: 0; overflow: hidden; cursor: default;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.3px);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #viewport.panning, #viewport.space { cursor: grab; }
  #viewport.panning.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #world.anim { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .card {
    position: absolute; width: var(--card-w); height: var(--card-h);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    cursor: pointer; transition: box-shadow .18s, border-color .18s; -webkit-tap-highlight-color: transparent;
  }
  .edit input { user-select: text; -webkit-user-select: text; }
  @keyframes card-in { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes card-out { to { transform: scale(.6); opacity: 0; } }
  .card.enter { animation: card-in .32s cubic-bezier(.2,.8,.2,1); }
  .card.leave { animation: card-out .2s ease-in forwards; pointer-events: none; }
  .marriage { transition: none; }
  @media (prefers-reduced-motion: reduce) { .card.enter, .card.leave { animation-duration: .01s; } }
  .card:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .card.editing { cursor: default; }
  .photo {
    position: relative; flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(145deg, hsl(var(--h, 230) 85% 92%), hsl(calc(var(--h, 230) + 40) 80% 88%)); overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; letter-spacing: .02em; color: hsl(var(--h, 230) 45% 42%);
    cursor: pointer; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--border);
  }
  @media (prefers-color-scheme: dark) { .photo { background: linear-gradient(145deg, hsl(var(--h, 230) 40% 28%), hsl(calc(var(--h, 230) + 40) 35% 24%)); color: hsl(var(--h, 230) 80% 82%); } }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .cam {
    position: absolute; inset: 0; background: rgba(20,24,40,.45); color: #fff; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s; font-size: 18px;
  }
  .photo:hover .cam { opacity: 1; }
  .photo-x {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; border: none;
    background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; padding: 0; cursor: pointer; display: none;
  }
  .card.editing .photo-x.has-photo { display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .name.empty, .dates.empty { color: var(--muted); font-weight: 400; }
  .dates { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card.editing .name, .card.editing .dates { display: none; }
  .edit { display: none; flex-direction: column; gap: 4px; }
  .card.editing .edit { display: flex; }
  .edit input[type=text] {
    width: 100%; font: inherit; font-weight: 600; font-size: 15px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 7px; outline: none; background: var(--card); color: var(--text);
  }
  .edit input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .edit .row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); height: 22px; }
  .edit .row label { width: 48px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit input.f-bname { font-weight: 400; font-size: 12px; padding: 1px 6px; flex: 1; width: 0; min-width: 0; }
  .card.editing { height: auto; min-height: var(--card-h); width: 320px; z-index: 2; }
  .edit input[type=date] { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px; outline: none; flex: 1; min-width: 0; color: var(--text); background: var(--card); }
  .edit .alive { display: flex; align-items: center; gap: 4px; width: auto; cursor: pointer; white-space: nowrap; color: var(--text); }
  .edit .alive input { margin: 0; }

  .plus {
    position: absolute; width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0;
    background: var(--accent); color: #fff; font-size: 18px; line-height: 26px; text-align: center; cursor: pointer;
    box-shadow: 0 2px 8px rgba(66,98,255,.45), 0 0 0 2px var(--card); opacity: 0; transform: scale(.6); transition: opacity .14s, transform .14s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .card:hover .plus, .card.selected .plus { opacity: 1; transform: scale(1); pointer-events: auto; }
  .card.editing .plus { opacity: 0; pointer-events: none; }
  .plus:hover { background: var(--accent-2); transform: scale(1.12) !important; }
  .plus.top { left: 50%; top: -13px; margin-left: -13px; }
  .plus.bottom { left: 50%; bottom: -13px; margin-left: -13px; }
  .plus.left { top: 50%; left: -13px; margin-top: -13px; }
  .plus.right { top: 50%; right: -13px; margin-top: -13px; }
  .plus::after {
    content: attr(data-tip); position: absolute; white-space: nowrap; font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 5px;
    background: #1f2430; color: #fff; opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .plus:hover::after { opacity: 1; }
  .plus.top::after { bottom: 30px; left: 50%; transform: translateX(-50%); }
  .plus.bottom::after { top: 30px; left: 50%; transform: translateX(-50%); }
  .plus.left::after { right: 30px; top: 50%; transform: translateY(-50%); }
  .plus.right::after { left: 30px; top: 50%; transform: translateY(-50%); }
  .plus.spouse { right: -13px; top: -13px; background: var(--love); box-shadow: 0 2px 8px rgba(229,72,143,.45), 0 0 0 2px var(--card); font-size: 13px; }
  .plus.spouse:hover { background: #c93579; }
  .plus.spouse::after { left: 30px; top: 50%; transform: translateY(-50%); }

  .marriage {
    position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--border-strong);
    color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 4px; line-height: 16px;
    box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
  }
  .marriage:hover { border-color: var(--love); box-shadow: 0 2px 10px rgba(229,72,143,.25); }
  .marriage .h { color: var(--love); font-size: 10px; }
  .marriage.empty { padding: 2px 6px; }

  #mpop { position: absolute; z-index: 25; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px 14px; width: 250px; display: none; font-size: 13px; animation: pop .14s cubic-bezier(.2,.8,.2,1); }
  #mpop.show { display: block; }
  #mpop h4 { margin: 0 0 8px; font-size: 13px; }
  #mpop .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #mpop label { width: 54px; color: var(--muted); font-size: 12px; }
  #mpop input[type=date] { flex: 1; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none; min-width: 0; background: var(--card); color: var(--text); }
  #mpop input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  #mpop .foot { display: flex; justify-content: space-between; margin-top: 10px; }
  #mpop button { border: none; background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 500; }
  #mpop button.danger { color: var(--danger); background: transparent; }

  #welcome { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 30; }
  #welcome.show { display: flex; }
  #welcome .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 24px 26px; width: 440px; max-width: calc(100vw - 24px); box-shadow: var(--shadow-lg); animation: pop .18s cubic-bezier(.2,.8,.2,1); }
  #welcome h2 { margin: 0 0 16px; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  #welcome h2::before { content: ""; width: 32px; height: 32px; border-radius: 9px; background: url('icons/icon.svg') center/cover; flex: none; }
  #welcome h3 { margin: 18px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #welcome button { font: inherit; border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--panel-2); color: var(--text); font-size: 14px; font-weight: 500; transition: background .12s; }
  #welcome button.primary { background: var(--accent); color: #fff; width: 100%; box-shadow: 0 6px 18px rgba(66,98,255,.3); }
  #welcome .foot { display: flex; gap: 8px; margin-top: 18px; }
  #welcome .foot button { flex: 1; }
  #welcome .recent { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; }
  #welcome .recent { background: transparent; border: 1px solid transparent; }
  #welcome .recent:hover { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
  #welcome .recent .ic { font-size: 18px; }
  #welcome .recent .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #welcome .recent .dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #welcome .recent .x { font-size: 16px; color: var(--muted); padding: 0 4px; border-radius: 6px; }
  #welcome .recent .x:hover { color: var(--danger); background: #fff; }
  #welcome .none { color: var(--muted); font-size: 13px; padding: 6px 0; }
  #sheet { position: absolute; inset: 0; background: rgba(20,24,40,.35); display: none; align-items: flex-end; justify-content: center; z-index: 35; }
  #sheet.show { display: flex; }
  #sheet .sheet {
    width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; background: var(--panel); border-radius: 20px 20px 0 0; padding: 8px 20px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(20,24,40,.25); animation: sheet-up .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  #sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #d7dbe5; margin: 4px auto 10px; }
  #sheet h4 { margin: 0 0 12px; font-size: 16px; }
  #sheet .sh-head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  #sheet .photo { flex: 0 0 72px; width: 72px; height: 72px; font-size: 24px; }
  #sheet .photo .cam { opacity: 1; background: rgba(20,24,40,.25); font-size: 20px; display: flex; }
  #sheet .sh-names { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #sheet input[type=text], #sheet input[type=date] { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; width: 100%; min-width: 0; background: var(--card); color: var(--text); }
  #sheet input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #sheet #sh-name { font-weight: 600; }
  #sheet .sh-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  #sheet .sh-row > span { width: 70px; flex: none; }
  #sheet .sh-alive input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
  #sheet .foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  #sheet button { border: none; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 500; cursor: pointer; background: var(--panel-2); color: var(--text); }
  #sheet button.primary { background: var(--accent); color: #fff; flex: 1; }
  #sheet button.danger { color: var(--danger); background: transparent; }
  #crop { position: absolute; inset: 0; background: rgba(20,24,40,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
  #crop.show { display: flex; }
  #crop .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; width: 340px; max-width: calc(100vw - 24px); box-shadow: var(--shadow-lg); animation: pop .16s cubic-bezier(.2,.8,.2,1); }
  #crop h4 { margin: 0 0 12px; font-size: 15px; }
  #crop .stage { position: relative; width: 300px; height: 300px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: var(--panel-2); touch-action: none; cursor: grab; }
  #crop .stage:active { cursor: grabbing; }
  #crop canvas { width: 300px; height: 300px; display: block; }
  #crop .mask { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px color-mix(in srgb, var(--panel) 65%, transparent); pointer-events: none; border: 1px solid color-mix(in srgb, var(--text) 15%, transparent); }
  #crop .zoomrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  #crop .zoomrow input { flex: 1; }
  #crop .zoomrow #crop-deg { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  #crop .rotrow { display: flex; gap: 8px; margin-top: 10px; }
  #crop .rotrow button { flex: 1; }
  #crop .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  #crop .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #crop button { border: none; background: var(--panel-2); color: var(--text); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 500; }
  #crop button.primary { background: var(--accent); color: #fff; }
  #rpop { position: absolute; z-index: 25; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px 14px; width: 260px; display: none; font-size: 13px; animation: pop .14s cubic-bezier(.2,.8,.2,1); }
  #rpop.show { display: block; }
  #rpop h4 { margin: 0 0 8px; font-size: 13px; }
  #rpop .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #rpop label { width: 60px; color: var(--muted); font-size: 12px; }
  #rpop select, #rpop input { flex: 1; font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none; min-width: 0; background: var(--card); color: var(--text); }
  #rpop .foot { display: flex; justify-content: space-between; margin-top: 10px; }
  #rpop button { border: none; background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 500; }
  #rpop button.danger { color: var(--danger); background: transparent; }
  #mpop select { flex: 1; font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--card); color: var(--text); min-width: 0; }
  #sheet select { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; width: 100%; background: var(--card); color: var(--text); }
  .edit select.f-fate { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid var(--border); border-radius: 6px; flex: 1; min-width: 0; background: var(--card); color: var(--text); }
  .edit .row .ended { display: flex; align-items: center; gap: 4px; width: auto; color: var(--text); white-space: nowrap; cursor: pointer; }
  .card.unborn { border-style: dashed; background: var(--panel-2); }
  .card.unborn .photo { background: var(--panel-2); color: var(--muted); font-size: 22px; }
  .card.unborn .name { color: var(--muted); }
  .fate-chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: middle; }
  body.linking #viewport { cursor: crosshair; }
  body.linking .card { cursor: crosshair; }
  body.linking .card.link-source { outline: 2px dashed var(--accent); outline-offset: 3px; }
  body.linking .card:hover { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  #edges path.partners { stroke-dasharray: 6 5; }
  #edges path.slash { stroke: var(--danger); stroke-width: 2; }
  #edges path.ended { stroke: #9aa2b8; stroke-width: 2; }
  #edges path.rel { fill: none; stroke-width: 2; }
  #edges path.rel.close { stroke: #2aa871; stroke-width: 3; }
  #edges path.rel.conflict { stroke: #e5484d; stroke-dasharray: 2 4; }
  #edges path.rel.distant { stroke: #9aa2b8; stroke-dasharray: 8 6; }
  #edges path.rel.cutoff { stroke: #1f2430; stroke-dasharray: 1 4; }
  .relbadge { position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--border-strong); font-size: 11px; color: var(--muted); white-space: nowrap; cursor: pointer; box-shadow: var(--shadow-sm); }
  .relbadge:hover { border-color: var(--accent); }
  #menu { position: absolute; z-index: 45; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; display: none; min-width: 190px; animation: pop .14s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(-4px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  #menu.show { display: block; }
  #menu .t { font-size: 11px; color: var(--muted); padding: 4px 8px; }
  #menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #menu button:hover, #menu button:focus { background: var(--panel-2); outline: none; }

  #empty {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted);
  }
  #empty .big {
    width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: #fff; font-size: 40px; line-height: 68px; font-weight: 300;
    box-shadow: 0 10px 28px rgba(66,98,255,.35); transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
  }
  #empty:hover .big { transform: scale(1.08); box-shadow: 0 14px 34px rgba(66,98,255,.45); }
  #empty[hidden] { display: none; }
  #empty p { margin: 0; font-size: 15px; font-weight: 500; color: var(--text); }
  #empty small { font-size: 12.5px; color: var(--muted); }

  .bar {
    position: absolute; display: flex; align-items: center; gap: 2px; padding: 5px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    z-index: 10; user-select: none;
  }
  #topleft { left: 16px; top: 16px; }
  #topright { right: 16px; top: 16px; }
  #bottom { left: 50%; bottom: 16px; transform: translateX(-50%); font-size: 12px; color: var(--muted); padding: 8px 14px; gap: 14px; }
  #bottom span { display: inline-flex; align-items: center; gap: 5px; }
  .bar button {
    border: none; background: transparent; border-radius: 9px; padding: 0 10px; height: 32px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px; transition: background .12s, color .12s;
  }
  .bar button svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .bar button:hover { background: var(--panel-2); }
  .bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  #topright button:not([data-act=fit]) { padding: 0 8px; }
  #topright button:not([data-act=fit]) .lbl { display: none; }
  [data-act=filemenu] { display: none; }
  #filename { font-weight: 650; font-size: 13px; padding: 0 8px 0 10px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  #filename::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); transition: background .2s, box-shadow .2s; }
  #filename.dirty::before { background: #f5a524; box-shadow: 0 0 0 3px rgba(245,165,36,.2); }
  #lang { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid var(--border); border-radius: 9px; padding: 0 4px; height: 30px; background: var(--panel-2); color: var(--text); margin: 0 4px; }
  .name .nee { font-weight: 400; color: var(--muted); font-size: 13px; }
  #zoomlvl { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted); }
  kbd { display: inline-block; min-width: 18px; text-align: center; padding: 1px 5px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px; font-family: inherit; font-size: 11px; color: var(--text); }

  #toast {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%) translateY(10px); background: #1b2030; color: #fff; padding: 9px 14px;
    border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #help { position: absolute; inset: 0; background: rgba(12,16,28,.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 30; }
  #help.show { display: flex; }
  #help .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px 28px; width: 560px; max-height: 80vh; overflow: auto; box-shadow: var(--shadow-lg); animation: pop .16s cubic-bezier(.2,.8,.2,1); }
  #help h2 { margin: 0 0 14px; font-size: 18px; }
  #help h3 { margin: 16px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #help .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-size: 13px; }
  #help .grid div { display: flex; justify-content: space-between; gap: 12px; }
  #help .grid span:last-child { white-space: nowrap; }
  input[type=file] { display: none; }

  #actions { left: 50%; bottom: 16px; transform: translateX(-50%); display: none; }
  #actions.show { display: flex; }
  #actions button { padding: 0 12px; white-space: nowrap; }
  #actions button.danger { color: var(--danger); }
  #actions button.danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
  body.has-selection #bottom { display: none; }

  @media (pointer: coarse) {
    .plus { width: 34px; height: 34px; line-height: 34px; font-size: 22px; opacity: 0; }
    .plus.top { top: -17px; margin-left: -17px; } .plus.bottom { bottom: -17px; margin-left: -17px; }
    .plus.left { left: -17px; margin-top: -17px; } .plus.right { right: -17px; margin-top: -17px; }
    .plus.spouse { right: -17px; top: -17px; }
    .marriage { font-size: 12px; padding: 4px 10px; }
    .card:hover .plus { opacity: 0; pointer-events: none; }
    .card.selected .plus { opacity: 1; pointer-events: auto; transform: scale(1); }
    .card.editing .plus { opacity: 0; pointer-events: none; }
    .photo .cam { display: none; }
    .edit input[type=text], .edit input[type=date] { font-size: 16px; }
    #bottom { display: none; }
    #actions [data-sel=edit], #actions [data-sel=photo], #actions [data-sel=delete], #actions .sep { display: none; }
  }
  @media (max-width: 640px) {
    #topleft { left: 8px; top: calc(8px + env(safe-area-inset-top)); }
    #topright { left: 8px; right: auto; top: calc(56px + env(safe-area-inset-top)); }
    #filename { max-width: 110px; }
    .bar button { padding: 6px 8px; }
    #topright [data-act=fit], #topright [data-act=help], #topright #zoomlvl, #topright .sep { display: none; }
    #topright #lang { display: inline-block; }
    #topleft [data-act=new], #topleft [data-act=open], #topleft [data-act=save], #topleft [data-act=saveas], #topleft [data-act=pdf], #topleft [data-act=download], #topleft .sep:has(+ [data-act=pdf]) { display: none; }
    #topleft [data-act=filemenu] { display: inline-block; font-weight: 600; }
    #filename { max-width: 180px; }
    #actions { bottom: calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; width: calc(100vw - 16px); max-width: 420px; }
    #actions button { flex: 1 1 30%; }
    body.has-selection #toast { bottom: calc(132px + env(safe-area-inset-bottom)); }
    #help .panel { width: calc(100vw - 24px); padding: 18px; }
    #help .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<div id="viewport">
  <div id="world">
    <svg id="edges"></svg>
    <div id="badges"></div>
    <div id="cards"></div>
  </div>
  <div id="empty" hidden>
    <div class="big">+</div>
    <p data-i18n="empty"></p>
    <small><kbd>Enter</kbd> · <kbd>N</kbd></small>
  </div>
</div>

<div class="bar" id="topleft">
  <span id="filename">Untitled tree</span>
  <span class="sep"></span>
  <button data-act="filemenu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lbl" data-i18n="file_menu"></span></button>
  <button data-act="new" data-i18n-title="new_t"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><span class="lbl" data-i18n="new"></span></button>
  <button data-act="open" data-i18n-title="open_t"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl" data-i18n="open"></span></button>
  <button data-act="save" data-i18n-title="save_t"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></svg><span class="lbl" data-i18n="save"></span></button>
  <button data-act="saveas" data-i18n-title="saveas_t"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M12 10v6M9 13h6"/></svg><span class="lbl" data-i18n="saveas"></span></button>
  <span class="sep"></span>
  <button data-act="pdf" data-i18n-title="export_t"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg><span class="lbl" data-i18n="export_pdf"></span></button>
  <button data-act="download" data-i18n-title="download_t" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span class="lbl" data-i18n="download"></span></button>
</div>
<div class="bar" id="topright">
  <button data-act="undo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">↶</span></button>
  <button data-act="redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="lbl">↷</span></button>
  <span class="sep"></span>
  <button data-act="zoomout" title="Zoom out (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span class="lbl">−</span></button>
  <span id="zoomlvl">100%</span>
  <button data-act="zoomin" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">+</span></button>
  <button data-act="fit" data-i18n-title="fit_t"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="lbl" data-i18n="fit"></span></button>
  <span class="sep"></span>
  <select id="lang" title="Language"><option value="en">EN</option><option value="ru">RU</option><option value="de">DE</option></select>
  <button data-act="help" data-i18n-title="help_t"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>

<div class="bar" id="bottom">

  <span><kbd>?</kbd> <span data-i18n="hint_help"></span></span>

  <button data-sel="photo" data-i18n="photo"></button>
  <span class="sep"></span>
  <button data-sel="parent" data-i18n="add_parent"></button>
  <button data-sel="sibling-right" data-i18n="add_sibling"></button>
  <button data-sel="child" data-i18n="add_child"></button>
  <button data-sel="spouse" data-i18n="add_spouse"></button>

  <button data-sel="delete" class="danger" data-i18n="delete"></button>

<div id="toast"></div>

  <div class="foot"><button class="danger" id="m-unlink" data-i18n="unlink"></button><button id="m-close" data-i18n="done"></button></div>
</div>
<div id="menu"></div>
<div id="rpop">

  <div class="foot"><button class="danger" id="r-delete" data-i18n="delete"></button><button id="r-close" data-i18n="done"></button></div>
</div>
<div id="welcome">
  <div class="panel">
    <h2 data-i18n="app"></h2>
    <button class="primary" id="w-continue" hidden></button>
    <h3 id="w-list-title"></h3>
    <div id="w-recent"></div>
    <div class="foot">
      <button id="w-open"></button>
      <button id="w-new" data-i18n="new_tree"></button>
    </div>
  </div>
</div>
<div id="sheet">
  <div class="sheet">
    <div class="grab"></div>
    <h4 data-i18n="sheet_title"></h4>
    <div class="sh-head">
      <div class="photo" id="sh-photo"></div>
      <div class="sh-names">
        <input type="text" id="sh-name" autocomplete="off" autocapitalize="words" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
        <input type="text" id="sh-bname" autocomplete="off" autocapitalize="words" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">
      </div>
    </div>
    <label class="sh-row"><span data-i18n="born"></span><input type="date" id="sh-birth"></label>
    <label class="sh-row sh-alive"><span data-i18n="living"></span><input type="checkbox" id="sh-alive"></label>
    <label class="sh-row" id="sh-death-row"><span data-i18n="died"></span><input type="date" id="sh-death"></label>
    <label class="sh-row"><span data-i18n="fate"></span><select id="sh-fate"><option value="" data-i18n="fate_none"></option><option value="miscarriage" data-i18n="fate_miscarriage"></option><option value="abortion" data-i18n="fate_abortion"></option><option value="stillborn" data-i18n="fate_stillborn"></option></select></label>
    <label class="sh-row sh-alive"><span data-i18n="line_ended"></span><input type="checkbox" id="sh-ended"></label>
    <div class="foot"><button id="sh-delete" class="danger" data-i18n="delete"></button><button id="sh-done" class="primary" data-i18n="done"></button></div>
  </div>
</div>
<div id="crop">

    <h4 data-i18n="crop_title"></h4>

    <div class="zoomrow"><span data-i18n="zoom"></span><input type="range" id="crop-zoom" min="0" max="1000" value="0"></div>
    <div class="zoomrow"><span data-i18n="straighten"></span><input type="range" id="crop-angle" min="-45" max="45" value="0"><span id="crop-deg">0°</span></div>
    <div class="rotrow">

      <button type="button" id="crop-rr" data-i18n-title="rotate_r">↻ 90°</button>

    <div class="foot"><button id="crop-cancel" data-i18n="cancel"></button><button id="crop-ok" class="primary" data-i18n="apply"></button></div>
  </div>
</div>

<div id="help"><div class="panel"></div></div>

  function applyPositions(map) {

  function animatePositions() {

  function fullName(p) { return p.birthName ? `${p.name || t('unnamed')} (${t('nee')} ${p.birthName})` : (p.name || t('unnamed')); }

    async remember(handle) {
      try {
        for (const r of await this.all()) if (await r.handle.isSameEntry(handle)) await this.remove(r.id);
        await this.add({ handle, name: handle.name, time: Date.now() });
        for (const r of (await this.all()).slice(8)) await this.remove(r.id);
      } catch (_) {}
    },
  });
  const library = store('library');
  let libraryId = null;
  async function saveToLibrary(blob, asNew) {
    const data = await blob.arrayBuffer();
    if (libraryId && !asNew) await library.put({ id: libraryId, name: fileName, data, time: Date.now() });
    else libraryId = await library.add({ name: fileName, data, time: Date.now() });
  }
  async function openLibrary(id) {
    const rec = await library.get(id);
    if (!rec) return toast(t('file_missing'));
    loadData(rec.data, rec.name); libraryId = rec.id; hideWelcome();
  }
  function download() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(serialize()); a.download = isUntitled() ? 'family-tree' + EXT : fileName; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  const welcome = $('#welcome');
  async function openHandle(h, id) {
    try {
      let perm = await h.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await h.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return toast(t('perm_denied'));
      const buf = await (await h.getFile()).arrayBuffer();
      loadData(buf, h.name); fileHandle = h; recents.remember(h);
      hideWelcome();
    } catch (err) {
      if (err.name === 'NotFoundError') { if (id != null) await recents.remove(id); toast(t('file_missing')); showWelcome(); }
      else toast(t('open_failed') + ': ' + err.message);
    }
  }
  async function showWelcome() {
    const list = hasFS ? await recents.all() : await library.all();
    $('#w-list-title').textContent = t(hasFS ? 'recent' : 'library');
    $('#w-open').textContent = t(hasFS ? 'open_file' : 'import_file');
    const cont = $('#w-continue');
    cont.hidden = !(dirty && people().length);
    cont.textContent = `${t('continue_draft')} · ${fileName}`;
    const box = $('#w-recent');
    box.innerHTML = list.length ? '' : `<div class="none">${esc(t('no_recent'))}</div>`;
    for (const r of list) {
      const b = document.createElement('button'); b.className = 'recent';
      b.innerHTML = `<span class="ic">🌳</span><span class="nm">${esc(r.name)}</span><span class="dt">${esc(new Date(r.time).toLocaleDateString(lang))}</span><span class="x" title="${esc(t(hasFS ? 'forget' : 'delete'))}">×</span>`;
      b.addEventListener('click', async (e) => {
        if (e.target.classList.contains('x')) {
          if (!hasFS && !confirm(t('delete_tree'))) return;
          await (hasFS ? recents : library).remove(r.id); if (libraryId === r.id) libraryId = null;
          b.remove(); if (!box.children.length) box.innerHTML = `<div class="none">${esc(t('no_recent'))}</div>`; return;
        }
        if (hasFS) openHandle(r.handle, r.id); else openLibrary(r.id);
      });
      box.appendChild(b);
    }
    welcome.classList.add('show');
  }
  function hideWelcome() { welcome.classList.remove('show'); }
  $('#w-continue').addEventListener('click', hideWelcome);
  $('#w-open').addEventListener('click', async () => { if (hasFS) { hideWelcome(); await open(true); } else fileInput.click(); });
  $('#w-new').addEventListener('click', () => { if (dirty && people().length && !confirm(t('discard'))) return; dirty = false; newTree(); hideWelcome(); });
  welcome.addEventListener('pointerdown', (e) => { if (e.target === welcome && (people().length || !hasFS)) hideWelcome(); });

  function scheduleDraft() {
    clearTimeout(scheduleDraft.t);
    scheduleDraft.t = setTimeout(() => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ state, fileName, dirty, libraryId })); } catch (_) {}
    }, 400);
    if (dirty) scheduleAutosave();
  }
  const canAutosave = () => hasFS ? !!fileHandle : true;
  function scheduleAutosave() {
    if (!canAutosave()) return;
    clearTimeout(scheduleAutosave.t);
    scheduleAutosave.t = setTimeout(autosave, 900);
  }
  let autosaving = false, autosaveAgain = false;
  async function autosave() {
    if (!dirty || !canAutosave()) return;
    if (autosaving) { autosaveAgain = true; return; }
    autosaving = true;
    try {
      const blob = serialize();
      if (hasFS) { const w = await fileHandle.createWritable(); await w.write(blob); await w.close(); }
      else await saveToLibrary(blob, false);
      dirty = false; $('#filename').classList.remove('dirty'); document.title = fileName + ' — ' + t('app');
      scheduleDraft();
    } catch (err) {
      if (!autosave.warned) { autosave.warned = true; toast(t('autosave_failed') + ': ' + err.message); }
    } finally {
      autosaving = false;
      if (autosaveAgain) { autosaveAgain = false; scheduleAutosave(); }
    }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) { clearTimeout(scheduleAutosave.t); autosave(); } });
  function restoreDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (d && d.state && Object.keys(d.state.people).length) { state = d.state; state.relations ??= []; fileName = d.fileName || fileName; dirty = !!d.dirty; libraryId = d.libraryId || null; return true; }
    } catch (_) {}
    return false;
  }
  window.addEventListener('beforeunload', (e) => { if (dirty && !canAutosave()) { e.preventDefault(); e.returnValue = ''; } else if (dirty) { clearTimeout(scheduleAutosave.t); autosave(); } });

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  fileName = t('untitled');
  const restored = restoreDraft();
  applyI18n();
  render();
  document.getElementById('lang').addEventListener('change', (e) => setLang(e.target.value));
  if (restored) fitView(); else resetView();
  $('[data-act=download]').hidden = hasFS;
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async (params) => {
      const h = params.files?.[0]; if (!h) return;
      try { await openHandle(h); } catch (_) {}
    });
  }
  (async () => {
    const last = (hasFS ? await recents.all() : await library.all())[0];
    if (last && !(restored && dirty)) {
      try {
        if (!hasFS) { await openLibrary(last.id); return; }
        if (await last.handle.queryPermission({ mode: 'readwrite' }) === 'granted') { await openHandle(last.handle, last.id); return; }
      } catch (_) {}
    }
    showWelcome();
  })();
})();
</script>
</body>
</html>
