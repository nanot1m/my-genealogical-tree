name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Layout report against the previous commit
        run: |
          git show HEAD~1:src/engine.js > tools/layout-trace/engine-before.js || echo "export function computeLayout() { return { positions: new Map(), hidden: new Set() }; }" > tools/layout-trace/engine-before.js
          npm run -s layout:report
      - uses: actions/upload-artifact@v7
        with:
          name: layout-report
          path: layout-report.md
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/configure-pages@v6
      - run: echo "{\"v\":\"$GITHUB_SHA\"}" > version.json
      - run: git show HEAD~1:src/engine.js > tools/layout-trace/engine-before.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
