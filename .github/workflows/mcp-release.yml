name: MCP binaries

on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            out: family-tree-mcp-macos-arm64
          - target: bun-darwin-x64
            out: family-tree-mcp-macos-x64
          - target: bun-windows-x64
            out: family-tree-mcp-windows-x64.exe
          - target: bun-linux-x64
            out: family-tree-mcp-linux-x64
          - target: bun-linux-arm64
            out: family-tree-mcp-linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun build --compile --minify --target=${{ matrix.target }} mcp/main.mjs --outfile dist/${{ matrix.out }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: "Standalone MCP server binaries. See mcp/README.md for setup."
